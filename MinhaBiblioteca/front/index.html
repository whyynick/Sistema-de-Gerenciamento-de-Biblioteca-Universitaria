<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <main class="flex-grow-1">

        <h1 id="title" class="text-center">UniBook</h1>

        <section id="new-btns" class="row justify-content-center gap-5">
            <button type="button" class="button btn btn-warning col-12 col-md-4">
                Novo Livro
            </button>
            <button type="button" class="button btn btn-warning col-12 col-md-4">
                Nova Revista
            </button>
        </section>

        <section id="acervo" class="container my-5 pb-5">
            <h1 class="text-center mb-4">Acervo da UniBook</h1>


            <div id="lista-materiais" class="row justify-content-center g-4">
                <p class="text-center text-muted">Carregando acervo....</p>
            </div>
        </section>

    </main>



    <footer class="text-center text-muted">
        <p>UniBook &reg; - Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
        crossorigin="anonymous"></script>
</body>

</html>
