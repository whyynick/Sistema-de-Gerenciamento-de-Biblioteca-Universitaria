<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <main class="flex-grow-1">

        <h1 id="title" class="text-center">UniBook</h1>

        <section id="new-btns" class="row justify-content-center gap-5">
            <button type="button" class="button btn btn-warning col-12 col-md-4" onclick="abrirFormularioNovo('livro')">
                Novo Livro
            </button>
            <button type="button" class="button btn btn-warning col-12 col-md-4"
                onclick="abrirFormularioNovo('revista')">
                Nova Revista
            </button>
        </section>

        <section id="acervo" class="container my-5 pb-5">
            <h1 class="text-center mb-4">Acervo da UniBook</h1>


            <div id="lista-materiais" class="row justify-content-center g-4">
                <p class="text-center text-muted">Carregando acervo....</p>
            </div>
        </section>

        <section id="secao-formulario" class="container my-4 d-none">
            <div class="card shadow-sm mx-auto" style="max-width: 650px;">
                <div class="card-header bg-warning text-dark d-flex justify-content-between align-items-center">
                    <h5 id="form-titulo" class="mb-0">Cadastrar Material</h5>
                    <button type="button" class="btn-close" onclick="fecharFormulario()"></button>
                </div>
                <div class="card-body">
                    <form id="form-material" onsubmit="salvarMaterial(event)">
                        <input type="hidden" id="form-id">
                        <input type="hidden" id="form-tipo">
                        <div class="mb-3">
                            <label for="campo-titulo" class="form-label">Título *</label>
                            <input type="text" id="campo-titulo" class="form-control" placeholder="Ex:Clean Code"
                                required>
                        </div>
                        <div class="mb-3">
                            <label for="campo-ano" class="form-label">Ano de Publicação *</label>
                            <input type="number" id="campo-ano" class="form-control" placeholder="Ex: 2025" min="0"
                                required>
                        </div>

                        <div id="campos-livro">
                            <div class="mb-3">
                                <label for="campo-autor" class="form-label">Autor *</label>
                                <input type="text" id="campo-autor" class="form-control"
                                    placeholder="Ex: Robert C. Martin">
                            </div>
                            <div class="mb-3">
                                <label for="campo-paginas" class="form-label">Número de Páginas *</label>
                                <input type="number" id="campo-paginas" class="form-control" placeholder="Ex: 432"
                                    min="1">
                            </div>
                        </div>
                        <div id="campos-revista" class="d-none">
                            <div class="mb-3">
                                <label for="campo-edicao" class="form-label">Edição *</label>
                                <input type="number" id="campo-edicao" class="form-control" placeholder="Ex: 10"
                                    min="1">
                            </div>

                            <div class="mb-3">
                                <label for="campo-mes" class="form-label">Mês de Publicação (1 a 12) *</label>
                                <input type="number" id="campo-mes" class="form-control" placeholder="Ex: 11" min="1"
                                    max="12">
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <button type="button" class="btn btn-secondary"
                                onclick="fecharFormulario()">Cancelar</button>
                            <button type="submit" class="btn btn-warning">Salvar</button>
                        </div>

                    </form>
                </div>
            </div>
        </section>

    </main>



    <footer class="text-center text-muted">
        <p>UniBook &reg; - Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
        crossorigin="anonymous"></script>
</body>

</html>
